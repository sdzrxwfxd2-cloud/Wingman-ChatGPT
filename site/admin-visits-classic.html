<!doctype html>
<meta charset="utf-8">
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Wingman visits</title>
<style>body{font:14px Inter,system-ui,sans-serif;background:#F8F7F3;color:#141a2a;padding:20px}h1{color:#0B3D91}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #dde3f0;padding:6px;text-align:left}th{color:#6b7287}
.note{color:#6b7287;font-size:12px;margin:8px 0 16px}#ex-banner{position:sticky;top:0;z-index:1;background:#E5A100;color:#14161B;font:700 11px/1.3 Inter,system-ui,sans-serif;text-align:center;padding:5px 8px;letter-spacing:.02em}input,button{font:14px Inter,system-ui,sans-serif;padding:6px 8px;margin:6px 6px 0 0}#err{color:#d33}a{color:#0B3D91}</style>
<div id="ex-banner" hidden>EXAMPLE DATA — not live visits</div>
<p class="note" id="ex-note" hidden>EXAMPLE DATA — not live visits. Local preview of the original /admin visit log.</p>
<div id="gate" hidden>
<h1>Visits</h1>
<form id="f" autocomplete="on">
<p class="note">Admin password required. Use the same admin password as /admin.</p>
<input id="pw" type="password" name="password" required autocomplete="current-password">
<button type="submit">Open</button>
<p id="err" hidden></p>
</form>
</div>
<div id="app" hidden>
<h1 id="h">Visits</h1>
<div id="tbl"></div>
<p class="note" id="outwrap"><a href="#" id="out">Log out</a></p>
</div>
<script>
/* Original Wingman /admin visit table (netlify/functions/admin.mjs): cream page, navy heading,
   Time (UTC) / City / Region / Country / Device / Browser. Live rows come from /api/admin/visits
   (admin session cookie, same password as /admin). Full IPs stay on that admin-only endpoint;
   this table does not add an IP column, matching the original. ?example=1 is localhost only. */
(function(){
var LOCAL=/^(localhost|127\.0\.0\.1)$/.test(location.hostname),EX=LOCAL&&new URLSearchParams(location.search).get("example")==="1";
var EXAMPLE={total:128,rows:[
  {t:"2026-11-11T00:08:00Z",city:"Example City",region:"Example Region",country:"ZA",os:"iPhone",browser:"Safari"},
  {t:"2026-11-10T23:16:00Z",city:"Sample Town",region:"Gauteng",country:"ZA",os:"Android",browser:"Chrome"},
  {t:"2026-11-10T20:40:00Z",city:"Demo Bay",region:"Western Cape",country:"ZA",os:"macOS",browser:"Safari"},
  {t:"2026-11-10T16:20:00Z",city:"Example City",region:"Example Region",country:"ZA",os:"Windows",browser:"Edge"},
  {t:"2026-11-09T22:20:00Z",city:"Sample Town",region:"Gauteng",country:"ZA",os:"iPad",browser:"Safari"}
]};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function utc(t){if(t==null||t==="")return"";var d=new Date(typeof t==="number"?t:Date.parse(t)||t);if(isNaN(d.getTime()))return String(t);return d.toISOString().replace(/\.\d{3}Z$/,"Z")}
function rowOf(r){return{t:utc(r.t||r.ts),city:r.city||"",region:r.region||"",country:r.country||"",os:r.os||"",browser:r.browser||""}}
function draw(total,rows){document.getElementById("h").textContent="Visits ("+total+" total, newest "+rows.length+" shown)";
  var html="<table><tr><th>Time (UTC)</th><th>City</th><th>Region</th><th>Country</th><th>Device</th><th>Browser</th></tr>";
  html+=rows.map(function(r){r=rowOf(r);return"<tr><td>"+esc(r.t)+"</td><td>"+esc(r.city)+"</td><td>"+esc(r.region)+"</td><td>"+esc(r.country)+"</td><td>"+esc(r.os)+"</td><td>"+esc(r.browser)+"</td></tr>"}).join("");
  document.getElementById("tbl").innerHTML=html+"</table>"}
function show(id){document.getElementById("gate").hidden=id!=="gate";document.getElementById("app").hidden=id!=="app"}
function err(msg){var e=document.getElementById("err");e.hidden=!msg;e.textContent=msg||""}
async function api(path,opt){var r=await fetch(path,Object.assign({credentials:"same-origin",cache:"no-store",headers:{"Accept":"application/json"}},opt||{}));var j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,data:j}}
async function load(){var r=await api("/api/admin/visits?range=all&limit=500");if(r.status===401){show("gate");return}if(!r.ok)throw new Error(r.data.error||("HTTP "+r.status));var rows=r.data.rows||[];draw(r.data.totalMatched||rows.length,rows);show("app")}
document.getElementById("f").addEventListener("submit",async function(ev){ev.preventDefault();err("");var r=await api("/api/admin/session",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:document.getElementById("pw").value})});
  if(r.ok){document.getElementById("pw").value="";load()}else err(r.data.error==="wrong password"?"That password is not right.":(r.data.error||"Could not sign in."))});
document.getElementById("out").addEventListener("click",async function(ev){ev.preventDefault();await api("/api/admin/session",{method:"DELETE"});show("gate")});
if(EX){document.getElementById("ex-banner").hidden=false;document.getElementById("ex-note").hidden=false;document.getElementById("outwrap").hidden=true;draw(EXAMPLE.total,EXAMPLE.rows);show("app")}
else{api("/api/admin/session").then(function(r){if(r.ok&&r.data.ok)load();else show("gate")}).catch(function(){err("Could not reach the server.");show("gate")})}
})();
</script>
