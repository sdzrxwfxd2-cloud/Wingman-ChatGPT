<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>Pilot profile - D2 with licence badges</title><script src="theme.js"></script><link rel="stylesheet" href="pp.css"><link rel="stylesheet" href="fx.css"><style>
.passes{margin-top:30px;display:grid;gap:0}
.pass{border-radius:22px;padding:20px;margin-top:-34px;min-height:120px;transition:transform .5s cubic-bezier(.22,.8,.2,1)}
.pass:first-child{margin-top:0}.pass:hover{transform:translateY(-10px)}
.pass .ph{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:10px}
.p1{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 55%,var(--gl)),var(--gl))!important}
.p2{background:linear-gradient(135deg,rgba(212,160,23,.45),var(--gl))!important}
.lic{min-height:250px}
.colD{display:grid;gap:14px;margin-top:18px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.wrap{display:grid;grid-template-columns:420px minmax(0,1fr);gap:28px;align-items:start}.passes{position:sticky;top:30px}.colD{margin-top:30px;grid-template-columns:repeat(2,minmax(0,1fr))}.colD .full{grid-column:span 2}}

@font-face{font-family:Clash;src:url(../fonts/app/clash-display-600.e748ea11.woff2) format("woff2");font-weight:600}
@font-face{font-family:ClashR;src:url(../fonts/app/clash-display-400.34b7af35.woff2) format("woff2")}
@font-face{font-family:Nippo;src:url(../fonts/app/nippo-500.c793aaa1.woff2) format("woff2");font-weight:500}
@font-face{font-family:Satoshi;src:url(../fonts/app/satoshi-500.af02a722.woff2) format("woff2");font-weight:500}
@font-face{font-family:GSans;src:url(../fonts/app/general-sans-600.94a2a0e1.woff2) format("woff2");font-weight:600}
:root{--ok:color-mix(in srgb,var(--tx) 78%,var(--acc));--due:color-mix(in srgb,var(--tx) 55%,#C9A24A)}
.av{background:none!important;padding:0!important;box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 0 0 .5px var(--hl)}
.av i{background:linear-gradient(160deg,var(--gl2),var(--bg2))!important;box-shadow:inset 0 0 0 .5px var(--ln);font-family:Clash,system-ui;font-weight:600!important;letter-spacing:.02em!important}
.pass{margin-top:-18px!important;padding-bottom:34px!important;min-height:0!important}.pass:first-child{margin-top:0!important}
.pass{box-shadow:0 1px 0 var(--hl) inset,0 30px 60px -30px rgba(0,0,0,.45),var(--sh)}
.pass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.09) 48%,transparent 60%);background-size:250% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}
.cur-t{display:grid;gap:14px;margin-top:4px}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
.dot.g{background:var(--ok)!important}.dot.a{background:var(--due)!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.ttl{font-family:Nippo,system-ui;font-weight:500;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--tx2);margin-top:8px}
h1{font-family:Satoshi,system-ui;font-weight:500;letter-spacing:-.02em;font-size:27px}
.strp{display:grid;grid-template-columns:repeat(3,1fr);border-top:.5px dashed var(--ln);margin-top:6px;padding-top:12px}
.strp>div{padding:0 12px;border-left:.5px solid var(--ln);animation:up .9s cubic-bezier(.22,.8,.2,1) both}
.strp>div:first-child{border-left:0;padding-left:0}.strp>div:nth-child(2){animation-delay:.12s}.strp>div:nth-child(3){animation-delay:.24s}
.strp .l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--tx3)}
.strp b{display:block;font-family:Nippo,system-ui;font-weight:500;font-size:30px;letter-spacing:.02em;line-height:1.1;margin-top:4px;color:var(--ok)}
.strp .due b{color:var(--due)}
.strp .u{font-size:11px;color:var(--tx2)}

/* No Logbook yet: hide hours and currency */
.pass:has(>.ph>span:first-child:is(.x,*)):has(.strp),section.card:has(>h2:first-child):is(.hide-nolog){display:none!important}
.bdg-brk{flex-basis:100%;height:0}
.tag.lic-main{padding:5px 12px 5px 9px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;
 background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 70%,#fff) 0%,var(--acc) 45%,color-mix(in srgb,var(--acc) 70%,#000) 100%);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 .5px rgba(255,255,255,.25),0 6px 16px -6px color-mix(in srgb,var(--acc) 70%,transparent);position:relative;overflow:hidden}
.tag.lic-main svg{width:13px;height:13px;fill:currentColor}
.tag.lic-main::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);background-size:250% 100%;animation:sheen 6s ease-in-out infinite}
.pact{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:.5px dashed var(--ln)}
.pbtn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:0;font-family:inherit;font-weight:600;font-size:12.5px;color:var(--tx);background:var(--gl2);box-shadow:inset 0 0 0 .5px var(--ln),inset 0 1px 0 var(--hl);cursor:pointer}
.pbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pbtn.pri{color:#fff;background:var(--acc);box-shadow:0 4px 12px -4px color-mix(in srgb,var(--acc) 70%,transparent)}
.chip.empty{opacity:.7;background:transparent;border:1px dashed var(--ln)}
.tag.lic-main::after{content:none!important;animation:none!important}.tag.lic-main{padding:5px 12px!important}
.shv{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:none;align-items:flex-end}.shv.on{display:flex}
.sheet{width:100%;box-sizing:border-box;border-radius:24px 24px 0 0;padding:10px 20px 34px;background:var(--bg2,var(--gl2));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 -10px 40px rgba(0,0,0,.25),inset 0 .5px 0 var(--hl);color:var(--tx)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 14px}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheet .top b{font-size:17px}
.sheet .lnk{background:none;border:0;font:inherit;font-size:16px;color:var(--tx2)}.sheet .lnk.sv{color:var(--acc);font-weight:700}
.fld{margin-bottom:16px}.fld label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.fld .in{height:46px;border-radius:14px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;font-size:16px;background:var(--gl2);box-shadow:inset 0 0 0 .5px var(--ln)}
.fld .in.focus{box-shadow:inset 0 0 0 1.5px var(--acc)}
.fld .in.lock{opacity:.55}.fld .hint{font-size:12px;color:var(--tx3);margin-top:6px}
.fld .in svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}
</style><style>html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{background:var(--bg,#f4f5f8);display:flex;align-items:center;justify-content:center}
.sc{width:960px;height:1230px;border-radius:64px;padding:72px;box-sizing:border-box;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 30%,#fff),color-mix(in srgb,var(--acc) 8%,#fff) 60%,#fff);box-shadow:0 1px 0 #fff inset,0 0 0 1px var(--ln),0 60px 120px -50px rgba(20,25,60,.45);position:relative;overflow:hidden}
.sci{height:100%;display:flex;flex-direction:column}
.ph{display:flex;justify-content:space-between;font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx3)}
.bd{display:flex;flex-wrap:wrap;gap:16px;margin-top:70px}.bd .tag{font-size:30px;padding:14px 28px}.bd .tag.lic-main{font-size:34px;padding:16px 32px}.bd .tag.lic-main svg{width:32px;height:32px}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px dashed var(--ln);padding-top:36px}
.wm{font-family:Nippo,system-ui;font-size:52px;letter-spacing:.35em;color:var(--acc)}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%}
</style></head><body><div class="sc"><div class="sci">
<div class="ph"><span>Wingman pilot pass</span><span>CPL(A) - ZA</span></div>
<div class="row" style="gap:40px;margin-top:40px"><div class="av" style="width:220px;height:220px"><i style="font-size:80px">MT</i></div>
<div><h1 style="font-size:76px">@capecpl_mt</h1><div class="ttl" style="font-size:28px">Commercial Pilot</div><div class="muted" style="font-size:32px;margin-top:6px">Cape Town &middot; Home FACT</div></div></div>
<div class="bd"><span class="tag gold">FOUNDING MEMBER</span><span class="bdg-brk"></span><span class="tag lic-main">CPL (A)</span><span class="bdg-brk"></span><span class="tag">Night rating</span><span class="tag">Instrument rating</span><span class="tag">Grade 3 Instructor</span><span class="tag">Grade 2 Instructor</span></div>
<div class="ft"><div><div class="wm">WINGMAN</div><div class="muted" style="font-size:24px">Pilot profile &middot; wingman-aero-app-3.netlify.app</div></div><div class="mono dim" style="font-size:22px;letter-spacing:.2em">MEMBER NO. 0007</div></div>
</div></div></body></html>
